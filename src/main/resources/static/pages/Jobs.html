<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smart Job Preparation</title><link rel="stylesheet" href="../css/advanced-practice.css"><style>body{font-family:Arial,sans-serif}.live-card{background:#fff;border-radius:18px;padding:28px;box-shadow:0 12px 35px rgba(30,41,59,.10);margin-bottom:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.field label{display:block;font-weight:700;margin-bottom:7px}.field input,.field textarea,.field select{width:100%;box-sizing:border-box;padding:12px;border:1px solid #dbe1ea;border-radius:10px}.btnx{border:0;border-radius:10px;padding:12px 18px;background:#635bff;color:white;font-weight:700;cursor:pointer;margin-top:14px}.btnx.secondary{background:#0f172a}.btnx.linkedin{background:#0a66c2}.result{margin-top:22px;padding:20px;border-radius:14px;background:#f8fafc;line-height:1.55}.score-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-top:15px}.score{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:14px;text-align:center}.score b{display:block;font-size:25px}.pill{display:inline-block;padding:5px 10px;border-radius:99px;background:#e0e7ff;margin:4px}.job{border:1px solid #e2e8f0;border-radius:12px;padding:16px;margin:10px 0;background:white}.job a{font-weight:700;color:#4f46e5}.resource{display:inline-block;padding:10px 13px;border:1px solid #dbe1ea;border-radius:10px;margin:6px 6px 0 0;background:white;text-decoration:none}.question{font-size:20px;font-weight:700;background:#eef2ff;padding:18px;border-radius:12px}.timer{font-size:26px;font-weight:800}.mic-on{background:#dc2626!important}.bar{height:9px;background:#e2e8f0;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#635bff}</style></head><body><header class="navbar"><div class="logo">🤖 StudyBuddy AI</div><nav><a href="AdvancedPractice.html">← Advanced Practice</a></nav></header><main class="container"><section class="hero"><span class="badge">💼 LIVE SMART JOB PREPARATION</span><h1>Smart Job Preparation</h1><p>Search live job feeds, view a clear 10-line job description, match roles to your skills, and open interview resources.</p></section><section class="live-card"><div class="grid"><div class="field"><label>Job / Skill</label><input id="jobRole" placeholder="Java Developer"></div><div class="field"><label>Location</label><input id="jobLocation" placeholder="India / Remote / Hyderabad"></div><div class="field"><label>Experience</label><select id="jobExperience"><option>Fresher</option><option>1-2 Years</option><option>3-5 Years</option><option>5+ Years</option></select></div></div><button id="searchJobs" class="btnx">🔎 Search Jobs & Resources</button><div id="jobsResult" class="result"></div></section></main><script src="../js/api.js"></script><script src="../js/jobs.js"></script></body></html>
