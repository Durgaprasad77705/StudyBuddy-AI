server:
  port: ${PORT:8099}
  address: 0.0.0.0

spring:
  application:
    name: studybuddy-ai

  datasource:
    url: jdbc:h2:file:./data/aicoach;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  h2:
    console:
      enabled: true
      path: /h2-console

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:not-configured-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:not-configured-google-client-secret}
            scope: openid,profile,email

          github:
            client-id: ${GITHUB_CLIENT_ID:not-configured-github-client-id}
            client-secret: ${GITHUB_CLIENT_SECRET:not-configured-github-client-secret}
            scope: read:user,user:email

razorpay:
  key-id: ${RAZORPAY_KEY_ID:}
  key-secret: ${RAZORPAY_KEY_SECRET:}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}

app:
  jwt:
    secret: ${JWT_SECRET:change-this-super-secret-key-min-32-chars-long-please}
    expiration-ms: ${JWT_EXPIRATION_MS:315360000000}

  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:8099}

  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:8099}

ai:
  provider: ${AI_PROVIDER:ollama}
  api-key: ${ANTHROPIC_API_KEY:}
  model: ${AI_MODEL:claude-sonnet-4-6}
  fast-model: ${AI_FAST_MODEL:claude-haiku-4-5-20251001}
  base-url: ${AI_BASE_URL:http://127.0.0.1:11434/api/chat}
  timeout-ms: ${AI_TIMEOUT_MS:20000}

logging:
  level:
    com.aicoach: INFO
    app:
  recovery:
    secret: StudyBuddyRecovery2026_ChangeMe_7392
    app:
  recovery:
    secret: ${APP_RECOVERY_SECRET:}